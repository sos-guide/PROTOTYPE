server {
    listen 80 default_server;
    server_name _;
    root /var/www/sos-guide;
    index starter.html;

    # Accès direct au portail survivants (mode PRODUCTION simulé)
    location = /portal {
        try_files /index.html =404;
    }

    # API install — REMOTE_ADDR forcé à 127.0.0.1 pour bypasser whitelist IP en dev
    location = /api/install {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/api_install.php;
        fastcgi_param REMOTE_ADDR    "127.0.0.1";
        include /etc/nginx/fastcgi_params;
    }

    # APIs PHP (admin, update_config, reload_network)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_ADDR    $remote_addr;
        include /etc/nginx/fastcgi_params;
    }

    location /admin {
        auth_basic "Administration SOS-GUIDE (dev: admin/dev-sos-guide)";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REMOTE_ADDR    $remote_addr;
            include /etc/nginx/fastcgi_params;
        }
    }

    location /data/ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /starter.html;
        add_header Cache-Control "no-store";
    }

    location ~ /\. { deny all; }
}
