# /etc/tmpfiles.d/sos-guide-logs.conf
# Logs SOS-GUIDE — supprimés au redémarrage (conformité nLPD RS 235.1)
# Type 'r' : supprime le fichier s'il existe, sans erreur s'il est absent

r /var/log/sos-guide-install.log
r /var/log/sos-guide-firstboot-audit.log
r /var/log/sos-guide-admin-audit.log
r /var/log/sos-guide-update.log
r /var/log/sos-guide-firstboot.log
r /var/log/sos-guide-boot-check.log
r /var/log/sos-guide-fetch-tiles.log
r /var/log/sos-guide-lora.log
r /var/www/sos-guide/data/lora_inbox.json
